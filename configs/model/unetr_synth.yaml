# Spec 009 — UNETR fine-tuned on FPI synthetic-anomaly restoration. Byte-identical `params` to
# unetr.yaml (a test asserts this): only the registry name and the checkpoint path differ, so the
# existing recon+eval path runs completely unchanged (FR-14) — this is a fine-tune, not a new
# architecture. Registering it under a NEW name (rather than overriding unetr's checkpoint) keeps
# the "before" (unetr) and "after" (unetr_synth) cells from colliding in artifacts/metrics/.

name: unetr_synth
target: mri_ad.models.unetr.UNETRReconstruction

params:
  in_channels: 1
  img_size: [16, 128, 128]
  feature_size: 32
  hidden_size: 768
  mlp_dim: 3072
  num_heads: 12
  num_layers: 12
  patch_size: [16, 16, 16]
  norm_name: instance
  res_block: true
  conv_block: false
  dropout_rate: 0.0

checkpoint: ${paths.checkpoint_root}/unetr_synth.pth
