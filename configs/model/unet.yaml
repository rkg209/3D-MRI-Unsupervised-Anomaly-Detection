# MONAI UNet. Exact params recovered from legacy/UNET/3d_MonaiUNET_slices_MSE_.ipynb.
name: unet
target: mri_ad.models.unet.UNetModel

params:
  spatial_dims: 3
  in_channels: 1
  out_channels: 1
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  norm: BATCH
  dropout: 0.2 # 0.4 in the perceptual/multi-scale notebook

checkpoint: ${paths.checkpoint_root}/unet_mse.pth
