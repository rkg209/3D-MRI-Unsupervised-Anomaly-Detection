# Classical-ML baseline (Spec 006).
#
# Operating granularity is SLICE-LEVEL and is NOT a config switch: one 2D axial 128x128 slice
# is one sample, label = 1 iff the binarized seg slice holds a tumor voxel. This yields clean
# ROC-AUC comparable to standard binary-classification benchmarks but does NOT localize, so it
# is not directly comparable to voxel-level Dice (Spec 007 owns that caveat).
#
# PyRadiomics substitution: PyRadiomics is fragile to build on some platforms; this baseline
# uses scikit-image GLCM + first-order + gradient + a hand-rolled GLRLM instead (skimage ships
# no run-length implementation). Recorded in features.py's docstring and in every JSON artifact
# as `features.library: scikit-image` / `pyradiomics_used: false`.
granularity: slice-level
subject_limit: null

split:
  source: brats_test # acceptance 5 — the identical SplitContract split the DL pipeline uses
  build_contract_if_missing: true
  cv:
    scheme: StratifiedGroupKFold
    n_splits: 5
    shuffle: true # random_state IS cfg.seed, never a separate knob

features:
  library: skimage
  label_threshold_voxels: 1
  drop_empty_slices: true
  foreground_eps: 1.0e-6
  include_slice_index: false # z-position is anatomical prior, not texture — would inflate AUC for free
  percentiles: [5, 25, 50, 75, 95]
  glcm:
    levels: 32
    distances: [1]
    angles_deg: [0, 45, 90, 135]
    symmetric: true
    normed: true
    props: [contrast, dissimilarity, homogeneity, energy, correlation, ASM]
  runlength:
    levels: 16
    angles_deg: [0, 45, 90, 135]
  gradient:
    percentile: 90

cache:
  enabled: true
  refresh: false
  dir: ${paths.artifact_root}/classical/features

classifier:
  name: xgboost
  scale_pos_weight: auto # n_neg/n_pos of the TRAIN fold only, recomputed per fold
  params:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    reg_lambda: 1.0
    tree_method: hist # deterministic; exact/approx are not pinned across builds
    n_jobs: 4 # pinned: -1 makes tree construction machine-dependent
    eval_metric: logloss

report:
  metrics_dir: ${paths.artifact_root}/classical/metrics
  figures_dir: ${paths.artifact_root}/classical/figures
