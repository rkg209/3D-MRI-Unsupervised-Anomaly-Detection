[project]
name = "mri-ad"
version = "0.1.0"
description = "Unsupervised anomaly detection in 3D brain MRI — a reproducible comparative study."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "torch>=2.2,<3.0",
  "monai>=1.3,<2.0",
  "einops>=0.7",  # required by monai.networks.nets.ViT (UNETR backbone)
  "nibabel>=5.2",
  "numpy>=1.26,<3.0",
  "scipy>=1.11",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "torchmetrics>=1.3",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "imageio[ffmpeg]>=2.34",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# PyRadiomics is fragile to build on some platforms; Spec 006 owns the decision to
# use it or fall back to a scikit-image GLCM/first-order feature set.
radiomics = ["pyradiomics>=3.1"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mri_ad"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "ANN401", # allow Any where genuinely needed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"scripts/*" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/mri_ad"]
omit = ["src/mri_ad/viz/*"]
